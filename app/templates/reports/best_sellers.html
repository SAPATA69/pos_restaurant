{% extends 'base.html' %}{% block content %}<h2>รายงานเมนูขายดี</h2><form class="row g-2 mb-3"><div class="col-auto"><input class="form-control" type="date" name="start" value="{{ start }}"></div><div class="col-auto"><input class="form-control" type="date" name="end" value="{{ end }}"></div><div class="col-auto"><button class="btn btn-primary">กรองข้อมูล</button></div></form><div class="card"><div class="table-responsive"><table class="table mb-0"><thead><tr><th>#</th><th>เมนู</th><th>จำนวนที่ขาย</th><th>ยอดขาย</th></tr></thead><tbody>{% for row in rows %}<tr><td>{{ loop.index }}</td><td>{{ row.name }}</td><td>{{ row.quantity }}</td><td>{{ '%.2f'|format(row.sales|float) }} บาท</td></tr>{% else %}<tr><td colspan="4" class="text-center">ยังไม่มีข้อมูลการขาย</td></tr>{% endfor %}</tbody></table></div></div>{% endblock %}
