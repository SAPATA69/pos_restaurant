{% extends 'base.html' %}{% block content %}<div class="col-md-7"><h2>เพิ่มเมนูอาหาร</h2><form method="post" class="card card-body"><label class="form-label">ชื่อเมนู</label><input class="form-control mb-3" name="name" required><label class="form-label">ราคา</label><input class="form-control mb-3" name="price" type="number" min="0" step="0.01" required><label class="form-label">หมวดหมู่</label><input class="form-control mb-3" name="category" placeholder="เช่น อาหารจานเดียว"><label class="form-label">ตัวเลือก (คั่นด้วยเครื่องหมายจุลภาค)</label><input class="form-control mb-3" name="options" placeholder="เผ็ดน้อย, เพิ่มไข่ดาว"><button class="btn btn-primary">บันทึกเมนู</button></form></div>{% endblock %}
