<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <title>{% block title %}POS ร้านอาหาร{% endblock %}</title>
</head>
<body>
  <nav>
    <a href="{{ url_for('order.select_table') }}">โต๊ะ</a> |
    <a href="{{ url_for('menu.list_items') }}">เมนู</a> |
    <a href="{{ url_for('kitchen.display') }}">ครัว</a> |
    <a href="{{ url_for('auth.logout') }}">ออกจากระบบ</a>
  </nav>
  <hr>
  {% with messages = get_flashed_messages() %}
    {% if messages %}
      {% for m in messages %}<p style="color:red">{{ m }}</p>{% endfor %}
    {% endif %}
  {% endwith %}
  {% block content %}{% endblock %}
</body>
</html>
