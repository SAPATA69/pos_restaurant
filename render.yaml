services:
  - type: web
    name: pos-restaurant
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120 run:app
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: RESTAURANT_NAME
        value: ครัวอุบล POS
      - key: RESTAURANT_PHONE
        value: โทร. 08X-XXX-XXXX
      - key: PROMPTPAY_ID
        value: 0812345678
